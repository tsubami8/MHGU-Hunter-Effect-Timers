name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang and lld
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
          clang --version
          ld.lld --version

      - name: Build plugin
        run: |
          python source/build.py --output build/hunter_effect_timers.nro

      - name: Package for mods folder
        run: |
          plugin_dir="package/21-功能-猎人状态计时器/romfs/nativeNX/plugins"
          mkdir -p "$plugin_dir"
          cp build/hunter_effect_timers.nro source/mhgu_effect_timers.cfg "$plugin_dir/"
          cd package
          zip -9 -r "../MHGU-Hunter-Effect-Timers-${{ github.ref_name }}.zip" "21-功能-猎人状态计时器"
          cd ..
          unzip -l "MHGU-Hunter-Effect-Timers-${{ github.ref_name }}.zip"

      - name: Sync README version
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          python tools/sync_version.py "$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README 版本号已是 $GITHUB_REF_NAME，跳过提交"
            exit 0
          fi
          git add README.md
          git commit -m "docs: README 版本号同步到 ${GITHUB_REF_NAME}"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "::warning::rebase 冲突，放弃本次 README 同步（不影响发版）"
            git rebase --abort
            exit 0
          fi
          git push origin HEAD:main

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHGU-Hunter-Effect-Timers-${{ github.ref_name }}
          path: MHGU-Hunter-Effect-Timers-*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "MHGU-Hunter-Effect-Timers-${{ github.ref_name }}.zip" --clobber
